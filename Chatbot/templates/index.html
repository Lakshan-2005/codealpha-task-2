<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📱 SmartBot — Smartphone FAQ Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ─── App Shell ─────────────────────────────────────────── -->
  <div class="app-shell">

    <!-- Header -->
    <header class="chat-header">
      <div class="header-avatar">🤖</div>
      <div class="header-info">
        <h1>SmartBot</h1>
        <span class="status-dot"></span>
        <span class="status-text">Online · Smartphone FAQ Assistant</span>
      </div>
    </header>

    <!-- Chat Window -->
    <main class="chat-window" id="chatWindow">

      <!-- Welcome message injected on load -->
      <div class="message bot-message" id="welcomeMsg">
        <div class="avatar">🤖</div>
        <div class="bubble">
          <p>Hi there! 👋 I'm <strong>SmartBot</strong>, your smartphone FAQ assistant.</p>
          <p>Ask me anything about battery life, cameras, storage, repairs, and more!</p>
          <div class="suggested-chips" id="chips">
            <span class="chip">Show all phones</span>
            <span class="chip">Phones under ₹20,000</span>
            <span class="chip">Budget phones</span>
            <span class="chip">Samsung phones</span>
            <span class="chip">How do I extend battery life?</span>
            <span class="chip">What is 5G?</span>
          </div>
        </div>
      </div>

    </main>

    <!-- Typing Indicator (hidden by default) -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="avatar">🤖</div>
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Input Area -->
    <footer class="input-area">
      <textarea
        id="userInput"
        class="input-field"
        placeholder="Type your question here…"
        rows="1"
        maxlength="400"
        autocomplete="off"
      ></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </footer>

  </div><!-- /app-shell -->

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
